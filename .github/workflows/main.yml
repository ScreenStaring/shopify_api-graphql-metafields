name: Ruby

on:
  push:
    branches:
      - master

  pull_request:

# These specs are integration tests: they create, update, and delete metafields on one shared
# Shopify test store (spec/spec_helper.rb + spec/fixtures/products.csv) using fixed identifiers
# -- the TEST-* products and the namespace/key pair "shopifyapi-metafields"/"testsuite".
# Overlapping runs clobber each other, which surfaces as flaky failures in unrelated examples:
# a read-back of a value an example just set returns the value another run wrote, or
# metafieldsDelete returns null ("null if the corresponding metafield isn't found") because
# another run already deleted that metafield. So runs are serialized here.
#
# A better solution is to make the tests run-isolated instead: derive the namespace/key (and
# ideally the products) from something unique per run, e.g. github.run_id, so concurrent runs
# can never share state. Serializing is a stopgap until then.
concurrency:
  # Deliberately not scoped to the ref: a push to master and a PR run share the same store too,
  # so they must not overlap either.
  group: "${{ github.workflow }}"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SHOPIFY_DOMAIN: "${{ secrets.SHOPIFY_DOMAIN }}"
      SHOPIFY_ADMIN_TOKEN: "${{ secrets.SHOPIFY_ADMIN_TOKEN }}"
      # Need 0.1.4 minimum to delete metafield definitons
      SHOPIFY_DEV_TOOLS_VERSION: "0.1.4"
      SHOPIFY_DEV_TOOLS_DIR: "${{ github.workspace }}/.shopify-dev-tools"
    name: Ruby ${{ matrix.ruby }}
    strategy:
      # One Ruby at a time. Every matrix leg runs the full suite against the same test store
      # (see the comment on the concurrency group above), so parallel legs fight over the same
      # metafields. Going run-isolated is the real fix; this just makes the failures go away.
      max-parallel: 1
      matrix:
        ruby: ['4.0', '3.4', '3.3', '3.2', '3.1', '3.0', '2.7']

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Cache Shopify Development Tools
        id: cache-shopify-dev-tools
        uses: actions/cache@v4
        with:
          path: ${{ env.SHOPIFY_DEV_TOOLS_DIR }}
          key: shopify-dev-tools-${{ runner.os }}-${{ runner.arch }}-${{ env.SHOPIFY_DEV_TOOLS_VERSION }}

      - name: Install Shopify Development Tools
        if: steps.cache-shopify-dev-tools.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$SHOPIFY_DEV_TOOLS_DIR"
          curl -fsSL -o "$RUNNER_TEMP/shopify-dev-tools.tar.gz" \
            "https://github.com/ScreenStaring/shopify-dev-tools/releases/download/v${SHOPIFY_DEV_TOOLS_VERSION}/shopify-dev-tools_${SHOPIFY_DEV_TOOLS_VERSION}_linux_amd64.tar.gz"
          tar -xzf "$RUNNER_TEMP/shopify-dev-tools.tar.gz" -C "$SHOPIFY_DEV_TOOLS_DIR" sdt
          chmod +x "$SHOPIFY_DEV_TOOLS_DIR/sdt"

      - name: Add shopify-dev-tools to PATH
        run: echo "$SHOPIFY_DEV_TOOLS_DIR" >> "$GITHUB_PATH"

      - name: Run the default task
        run: bundle exec rake
